name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Do not cancel in-progress runs: rapid successive pushes/re-runs were
  # starving the queue and never finishing when runners are scarce.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  expert-gate:
    name: Expert v2 gate (check + focused tests)
    # ubuntu-latest has broader runner pool than a fixed 24.04 label.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install protoc
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent/target
          key: ${{ runner.os }}-cargo-expert-${{ hashFiles('agent/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-expert-

      - name: cargo check xai-grok-shell
        working-directory: agent
        run: cargo check -p xai-grok-shell

      - name: Expert unit gate
        working-directory: agent
        run: |
          set -euo pipefail
          cargo test -p xai-grok-shell --lib expert_consultant_tools -- --test-threads=1
          cargo test -p xai-grok-shell --lib expert_model_restore -- --test-threads=1
          cargo test -p xai-grok-shell --lib zero_http -- --test-threads=1
          cargo test -p xai-grok-shell --lib dual_two -- --test-threads=1
          cargo test -p xai-grok-shell --lib session::expert:: -- --test-threads=1

  lumen-crates:
    name: Lumen crates (guard/discipline/verify tests + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent/target
          key: ${{ runner.os }}-cargo-lumen-${{ hashFiles('agent/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lumen-

      - name: Tests
        working-directory: agent
        run: cargo test -p lumen-guard -p lumen-discipline -p lumen-verify

      - name: Permission + folder-trust gate (the security seam)
        working-directory: agent
        # The permission engine + folder-trust detector are where lumen-guard,
        # session grants, the classifier and repo-config authority all meet —
        # the core's most security-sensitive surface. Seven tests here were red
        # for weeks unnoticed because only expert-gate ran in CI. This closes
        # that gap. foreign_sessions::* is EXCLUDED on purpose: 15 pure-upstream
        # session-DB importer tests are red since Day-0 import and tracked
        # separately — do not let that noise mask a real permission regression.
        run: |
          cargo test -p xai-grok-workspace --lib permission::
          cargo test -p xai-grok-workspace --lib folder_trust::

      - name: Clippy (deny warnings on Lumen-owned crates only)
        working-directory: agent
        run: cargo clippy -p lumen-guard -p lumen-discipline -p lumen-verify -- -D warnings

  offline-gates:
    name: Offline gates (defaults / shellcheck / vacuous-e2e / versions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: assert-defaults
        run: bash scripts/assert-defaults.sh

      - name: shellcheck scripts
        run: |
          set -euo pipefail
          sudo apt-get update -y && sudo apt-get install -y shellcheck
          fail=0
          for f in scripts/*.sh; do
            # gate on error-severity findings only; style parity with local baseline
            if ! shellcheck -S error "$f"; then fail=1; fi
          done
          exit $fail

      - name: vacuous e2e checker
        run: bash scripts/check-vacuous-e2e.sh

      - name: version consistency
        run: bash scripts/check-version-consistency.sh

      - name: artifact freshness (SOURCE_LOCK critical files)
        run: bash scripts/check-artifact-freshness.sh
