# Lumen agent cargo configuration
#
# Compilation speed:
#   Install sccache: cargo install sccache
#   Then set SCCACHE_GCS_BUCKET (or local path) for CI caching.
#   macOS local: export RUSTC_WRAPPER=sccache
#
# Windows build notes:
#   - Set PROTOC env var if protoc is not on PATH (e.g., choco/scoop install)
#     $env:PROTOC = "C:\path\to\protoc.exe"
#   - Large PDB may hit MSVC linker limit (LNK1318). Workaround:
#     cargo rustc -p xai-grok-pager-bin --release -- -C link-arg=/DEBUG:NONE
#   - If temp dir contains CJK characters, set TMP/TEMP to a path without them:
#     $env:TMP = "C:\temp"; $env:TEMP = "C:\temp"
