[hints]
project_picker_disabled = true

[cli]
installer = "manual"
auto_update = false
show_tips = false
dismissed_version = "0.2.0-dev"

[ui]
max_thoughts_width = 120
fork_secondary_model = "deepseek-v4-pro"
yolo = false
compact_mode = false
permission_mode = "always-approve"

[models]
default = "kimi-k3"
default_reasoning_effort = "xhigh"

[features]
remote_fetch = false

[session]
auto_compact_threshold_percent = 80
load_envrc = false

[model.deepseek-chat]
model = "deepseek-chat"
name = "DeepSeek V4 Flash (Executor)"
base_url = "https://api.deepseek.com/v1"
api_backend = "chat_completions"
env_key = "DEEPSEEK_API_KEY"
max_completion_tokens = 8192
temperature = 0.0
context_window = 1000000
stream_tool_calls = true

[model.deepseek-v4-pro]
model = "deepseek-v4-pro"
name = "DeepSeek V4 Pro"
base_url = "https://api.deepseek.com/v1"
api_backend = "chat_completions"
env_key = "DEEPSEEK_API_KEY"
max_completion_tokens = 8192
temperature = 0.0
context_window = 1000000

[model.grok-4.5]
model = "grok-4.5"
name = "Grok 4.5 (Consultant)"
base_url = "https://api.x.ai/v1"
api_backend = "chat_completions"
max_completion_tokens = 8192
temperature = 0.0
context_window = 131072

[model.deepseek-v4-flash]
model = "deepseek-v4-flash"
name = "DeepSeek V4 Flash 0731正式版"
base_url = "https://api.deepseek.com/v1"
api_backend = "chat_completions"
api_key = "sk-YOUR_DEEPSEEK_FLASH_KEY"
