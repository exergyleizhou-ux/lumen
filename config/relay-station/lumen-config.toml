# ── Lumen Product Config (FINAL-5UX) ────────────────────────────────────────
# Primary config home: ~/.lumen/config.toml
# This is the AUTHORITATIVE source for Lumen model defaults and settings.
#
# Override layer: ~/.grok/config.toml (grok-build upstream config)
#   - ~/.lumen/config.toml wins for model defaults and product settings
#   - ~/.grok/config.toml provides UI/runtime overrides (permissions, themes)
#   - Run `scripts/lumen-config-check.sh` to validate consistency
#
# Lumen product config (FINAL-5UX). Primary home is ~/.lumen, not ~/.grok.
# Bottom-right status bar shows the live session model; this sets the cold-start default.

[models]
# Keep DeepSeek as cloud default; switch local with: lumen -m gemma4-12b
default = "kimi-k3"

[model.deepseek-chat]
model = "deepseek-chat"
name = "DeepSeek Chat"
base_url = "https://api.deepseek.com/v1"
api_backend = "chat_completions"
env_key = "DEEPSEEK_API_KEY"
context_window = 1000000

[model.deepseek-reasoner]
model = "deepseek-reasoner"
name = "DeepSeek Reasoner"
base_url = "https://api.deepseek.com/v1"
api_backend = "chat_completions"
env_key = "DEEPSEEK_API_KEY"
context_window = 1000000

# ── LM Studio (local OpenAI-compatible) ─────────────────────────────────────
# Server: lms server start   (default http://127.0.0.1:1234)
# Load:   lms load google/gemma-4-12b
# Key is ignored by LM Studio but required by Lumen's credential path.

[model.gemma4-12b]
model = "google/gemma-4-12b"
name = "Gemma 4 12B (LM Studio)"
base_url = "http://127.0.0.1:1234/v1"
api_backend = "chat_completions"
api_key = "lm-studio"
context_window = 8192

[model.lmstudio]
model = "google/gemma-4-12b"
name = "LM Studio (current)"
base_url = "http://127.0.0.1:1234/v1"
api_backend = "chat_completions"
api_key = "lm-studio"
context_window = 8192

# ── Goal / Delivery mode ───────────────────────────────────────────────────
[goal]
# /goal is enabled by default; this section is explicit documentation.
enabled = true

# Planner: self-contained subagent that breaks /goal into executable steps.
planner_enabled = true

# Verifier / classifier: runs after each planner execution to check
# whether the goal objective has been met.
classifier_enabled = true

# Summary: generates a recap when a goal is completed or cleared.
summary_enabled = true

[model.kimi-k3]
model = "kimi-k3"
name = "Kimi K3 (Proxy)"
base_url = "https://sub2api.eqing.tech/v1"
api_backend = "chat_completions"
api_key = "sk-YOUR_KEY_2_CN_MODELS"
context_window = 262144
supports_reasoning_effort = true
reasoning_effort = "high"

